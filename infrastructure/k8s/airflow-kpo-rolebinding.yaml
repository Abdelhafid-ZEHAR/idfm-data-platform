apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-kpo-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: airflow-worker
    namespace: airflow
roleRef:
  kind: Role
  name: airflow-kpo-role
  apiGroup: rbac.authorization.k8s.iokubectl get role -n default