apiVersion: batch/v1
kind: Job

metadata:
  name: idfm-ingestion

spec:
  backoffLimit: 2

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: ingestion

          image: idfm-ingestion:latest

          imagePullPolicy: Never

          env:
            - name: S3_ENDPOINT
              value: "http://minio:9000"

            - name: S3_ACCESS_KEY
              value: "minioadmin"

            - name: S3_SECRET_KEY
              value: "minioadmin"

            - name: S3_BUCKET
              value: "idfm-data"