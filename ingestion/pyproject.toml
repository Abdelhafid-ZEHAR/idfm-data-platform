[project]
name = "ingestion"
version = "0.1.0"
description = "IDFM data ingestion pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.0",
    "pandas>=2.3.0",
    "pyarrow>=21.0.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idfm_ingestion"]